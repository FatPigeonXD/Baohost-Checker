name: Check BaoHost Signups

on:
  workflow_dispatch:
    inputs:
      send_test_ping:
        description: 'Send a test ping to Discord right now?'
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: pip install curl_cffi

      - name: Monitor Panel Status
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: "1560630961199124560"
          TEST_PING: ${{ inputs.send_test_ping }}
        run: |
          import os
          import sys
          import json
          from curl_cffi import requests

          webhook_url = os.environ.get("WEBHOOK_URL", "").strip()
          role_id = os.environ.get("ROLE_ID", "").strip()
          test_ping = os.environ.get("TEST_PING", "false").lower() == "true"

          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK secret is empty!")
              sys.exit(1)

          def send_discord_message(text):
              payload = {
                  "content": text,
                  "allowed_mentions": {"parse": ["roles"]}
              }
              requests.post(webhook_url, json=payload, timeout=15)

          if test_ping:
              send_discord_message(f"<@&{role_id}> 🛠️ **Test Role Ping Successful!** Monitor is connected.")

          session = requests.Session(impersonate="chrome120")
          is_open = False
          reasons = []

          # 1. Check Live Panel (panel.baohost.com)
          try:
              resp = session.get("https://panel.baohost.com/auth/register", allow_redirects=True, timeout=20)
              final_url = str(resp.url).lower()
              status_code = resp.status_code

              if status_code == 200:
                  if "/login" not in final_url:
                      is_open = True
                      reasons.append("Panel returned 200 OK!")
                  else:
                      reasons.append("Panel redirected to /login (Closed)")
              elif status_code == 500:
                  reasons.append("Reached panel! Registration disabled (HTTP 500)")
              elif status_code == 403:
                  reasons.append("Panel Cloudflare JS Challenge (403)")
              else:
                  reasons.append(f"Panel HTTP {status_code}")
          except Exception as e:
              reasons.append(f"Panel error ({str(e)[:25]})")

          # 2. Check Help Center Article (help.baohost.com)
          try:
              resp2 = session.get("https://help.baohost.com/articles/registration-for-new-users", timeout=20)
              help_html = resp2.text.lower()
              if resp2.status_code == 200 and "closed" not in help_html:
                  is_open = True
                  reasons.append("Help Center updated!")
              else:
                  reasons.append("Help article says closed")
          except Exception as e:
              reasons.append("Help article unreachable")

          summary = " | ".join(reasons)
          if is_open:
              send_discord_message(f"<@&{role_id}> 🟢 **BaoHost Sign-Ups appear to be OPEN!** ({summary})\nRegister now: https://panel.baohost.com/auth/register")
          else:
              send_discord_message(f"🔴 **BaoHost Check:** Closed. *({summary})*")
