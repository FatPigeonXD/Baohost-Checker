name: Check BaoHost Signups

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Registration Status
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          USER_ID: "844844465835212820"
        run: |
          import os
          import sys
          import json
          import urllib.request

          webhook_url = os.environ.get("WEBHOOK_URL", "").strip()
          user_id = os.environ.get("USER_ID", "").strip()

          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK secret is empty!")
              sys.exit(1)

          url = "https://help.baohost.com/articles/registration-for-new-users"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})

          try:
              html = urllib.request.urlopen(req, timeout=15).read().decode("utf-8").lower()
              if "new registrations are currently closed" not in html:
                  msg = "<@" + user_id + "> 🟢 **BaoHost Sign-Ups appear to be OPEN!** - https://panel.baohost.com/auth/register"
                  data = {"content": msg}
                  post_req = urllib.request.Request(
                      webhook_url,
                      data=json.dumps(data).encode("utf-8"),
                      headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
                  )
                  urllib.request.urlopen(post_req)
                  print("SUCCESS: Alert sent to Discord!")
              else:
                  print("SUCCESS: Checked BaoHost — sign-ups are still closed.")
          except Exception as e:
              print("Check encountered an error:", e)
