name: Check BaoHost Signups

on:
  workflow_dispatch:
    inputs:
      send_test_ping:
        description: "Send a test role ping to Discord?"
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: pip install curl_cffi

      - name: Check BaoHost Registration
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: "1560630961199124560"
          TEST_PING: ${{ inputs.send_test_ping }}

        run: |
          import os
          import re
          import sys
          from curl_cffi import requests

          WEBHOOK_URL = os.environ.get("WEBHOOK_URL", "").strip()
          ROLE_ID = os.environ.get("ROLE_ID", "").strip()
          TEST_PING = os.environ.get("TEST_PING", "false").lower() == "true"

          REGISTER_URL = "https://panel.baohost.com/auth/register"

          if not WEBHOOK_URL:
              sys.exit("ERROR: DISCORD_WEBHOOK secret is missing!")

          if not ROLE_ID:
              sys.exit("ERROR: ROLE_ID is missing!")

          def send_discord(message):
              print("Sending Discord notification...")

              result = requests.post(
                  WEBHOOK_URL,
                  json={
                      "content": message,
                      "allowed_mentions": {
                          "parse": ["roles"]
                      }
                  },
                  timeout=20
              )

              print("Discord HTTP response:", result.status_code)
              result.raise_for_status()
              print("Discord message sent successfully!")

          # Optional test ping
          if TEST_PING:
              send_discord(
                  f"<@&{ROLE_ID}> 🛠️ *TEST PING SUCCESSFUL!*\n"
                  "Your BaoHost Signup Monitor is connected to Discord."
              )

          status = "UNKNOWN"
          reasons = []

          try:
              print("Connecting to BaoHost...")

              session = requests.Session(
                  impersonate="chrome120"
              )

              response = session.get(
                  REGISTER_URL,
                  allow_redirects=True,
                  timeout=30
              )

              html = response.text.lower()
              html = re.sub(r"\s+", " ", html)
              final_url = str(response.url).lower()

              print("Website HTTP:", response.status_code)
              print("Final URL:", final_url)

              # Cloudflare detection
              challenge_markers = [
                  "cf-chl-",
                  "challenge-platform",
                  "just a moment",
                  "checking your browser",
                  "verify you are human",
                  "enable javascript and cookies"
              ]

              if response.status_code == 403 or any(
                  marker in html for marker in challenge_markers
              ):
                  status = "UNKNOWN"
                  reasons.append("Cloudflare challenge detected.")

              elif response.status_code != 200:
                  status = "UNKNOWN"
                  reasons.append(
                      f"Website returned HTTP {response.status_code}."
                  )

              else:
                  # Actual paused messages from your screenshot
                  paused_markers = [
                      "sign up paused",
                      "sign up is temporarily disabled",
                      "new registrations are currently paused",
                      "slots are full at the moment",
                      "some server systems are under maintenance",
                      "no eta for when sign up will reopen"
                  ]

                  if any(marker in html for marker in paused_markers):
                      status = "CLOSED"
                      reasons.append(
                          "BaoHost registration is temporarily paused."
                      )

                  # Check for a real registration form
                  elif (
                      "/auth/register" in final_url
                      and "<form" in html
                      and re.search(
                          r'type=["\']password["\']|name=["\']password["\']',
                          html
                      )
                  ):
                      status = "OPEN"
                      reasons.append(
                          "Registration form detected!"
                      )

                  else:
                      status = "UNKNOWN"
                      reasons.append(
                          "Could not confirm registration availability."
                      )

          except Exception as error:
              status = "UNKNOWN"
              reasons.append(
                  f"Website checking error: {str(error)[:200]}"
              )

          summary = " | ".join(reasons)

          print("--------------------------------")
          print("BAOHOST STATUS:", status)
          print(summary)
          print("--------------------------------")

          # ALWAYS send a Discord notification

          if status == "OPEN":

              message = (
                  f"<@&{ROLE_ID}> 🟢 *BAOHOST SIGN-UPS ARE OPEN!*\n\n"
                  f"Registration: {REGISTER_URL}\n"
                  f"Details: {summary}\n\n"
                  "🚀 *REGISTER NOW!*"
              )

          elif status == "CLOSED":

              message = (
                  f"🔴 *BAOHOST SIGN-UPS ARE STILL CLOSED*\n\n"
                  f"Details: {summary}\n"
                  "I'll notify you when the registration page opens "
                  "on your next manual check."
              )

          else:

              message = (
                  f"🟡 *BAOHOST STATUS: UNKNOWN*\n\n"
                  f"Details: {summary}\n"
                  "The website could not be verified. "
                  "No OPEN status has been assumed."
              )

          send_discord(message)

          print("Monitor finished successfully.")
