name: Check BaoHost Signups

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      send_test_ping:
        description: 'Send a test ping to Discord right now?'
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Registration Status
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          USER_ID: "844844465835212820" # <-- Replace with your Discord User ID
          TEST_PING: ${{ inputs.send_test_ping }}
        run: |
          import os
          import sys
          import json
          import urllib.request

          webhook_url = os.environ.get("WEBHOOK_URL", "").strip()
          user_id = os.environ.get("USER_ID", "").strip()
          test_ping = os.environ.get("TEST_PING", "false").lower() == "true"

          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK secret is empty!")
              sys.exit(1)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5"
          }

          def send_discord_message(text):
              post_req = urllib.request.Request(
                  webhook_url,
                  data=json.dumps({"content": text}).encode("utf-8"),
                  headers={"Content-Type": "application/json", "User-Agent": headers["User-Agent"]}
              )
              urllib.request.urlopen(post_req, timeout=15)

          # 1. If you checked the "Send a test ping" box when running manually:
          if test_ping:
              send_discord_message("<@" + user_id + "> 🛠️ **Test Ping Successful!** Your BaoHost GitHub monitor is connected.")
              print("SUCCESS: Sent manual test ping to Discord!")
              sys.exit(0)

          # 2. Normal 10-minute check:
          url = "https://help.baohost.com/articles/registration-for-new-users"
          req = urllib.request.Request(url, headers=headers)

          try:
              html = urllib.request.urlopen(req, timeout=15).read().decode("utf-8").lower()
              if "closed" not in html and "disabled" not in html:
                  send_discord_message("<@" + user_id + "> 🟢 **BaoHost Sign-Ups appear to be OPEN!** - https://panel.baohost.com/auth/register")
                  print("SUCCESS: Alert sent to Discord!")
              else:
                  print("SUCCESS: Checked BaoHost — sign-ups are still closed.")
          except Exception as e:
              print("ERROR checking BaoHost:", e)
              sys.exit(1)
