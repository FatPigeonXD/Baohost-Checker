import asyncio
import time
import nodriver as uc
from curl_cffi import requests

WEBHOOK_URL = "secrets.DISCORD_WEBHOOK"
ROLE_ID = "1560630961199124560"  # Your Discord Role ID
CHECK_INTERVAL_MINUTES = 10

def send_discord_message(text):
    payload = {
        "content": text,
        "allowed_mentions": {"parse": ["roles"]}
    }
    try:
        requests.post(WEBHOOK_URL, json=payload, timeout=15)
    except Exception as e:
        print(f"Discord error: {e}")

async def check_panel():
    # Uses a saved profile folder so Cloudflare clearance cookies persist!
    browser = await uc.start(
        headless=False,
        user_data_dir="C:/baohost/chrome_profile"
    )
    try:
        page = await browser.get("https://panel.baohost.com/auth/register")
        
        # Wait 8 seconds for Cloudflare JS challenge ("Just a moment...") to auto-solve
        await page.sleep(8)
        
        title = (await page.evaluate("document.title")).lower()
        body_text = (await page.evaluate("document.body.innerText")).lower()
        current_url = (await page.evaluate("window.location.href")).lower()

        is_open = False
        if "just a moment" in title or "attention required" in title:
            # Click Turnstile checkbox automatically if prompted
            try:
                await page.verify_cf()
                await page.sleep(5)
                title = (await page.evaluate("document.title")).lower()
                body_text = (await page.evaluate("document.body.innerText")).lower()
            except Exception:
                pass

        if "just a moment" in title:
            status_detail = "Cloudflare challenge still loading"
        elif "500" in title or "server error" in body_text or "500" in body_text:
            status_detail = "Reached panel! Registration disabled (500 Server Error)"
        elif "/login" in current_url and "register" not in body_text:
            status_detail = "Reached panel! Redirected to /auth/login (Closed)"
        elif any(w in body_text for w in ["closed", "disabled", "not accepting"]):
            status_detail = "Reached panel! Page states sign-ups are closed"
        else:
            is_open = True
            status_detail = f"Registration page loaded! (Title: {title})"

        if is_open:
            send_discord_message(f"<@&{ROLE_ID}> 🟢 **BaoHost Sign-Ups are OPEN!** ({status_detail})\nRegister now: https://panel.baohost.com/auth/register")
        else:
            send_discord_message(f"🔴 **BaoHost Check:** Closed. *({status_detail})*")

    finally:
        browser.stop()

if __name__ == "__main__":
    print("Starting real Chrome monitor with saved Cloudflare profile...")
    while True:
        uc.loop().run_until_complete(check_panel())
        time.sleep(CHECK_INTERVAL_MINUTES * 60)
