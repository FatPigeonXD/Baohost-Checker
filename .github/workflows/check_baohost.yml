name: Check BaoHost Signups

on:
  workflow_dispatch:
    inputs:
      send_test_ping:
        description: "Send a test ping to Discord?"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: pip install curl_cffi

      - name: Check BaoHost Registration
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: "1560630961199124560"
          TEST_PING: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_ping || false }}

        run: |
          import os
          import re
          import sys
          from curl_cffi import requests

          WEBHOOK_URL = os.environ.get("WEBHOOK_URL", "").strip()
          ROLE_ID = os.environ.get("ROLE_ID", "").strip()
          TEST_PING = os.environ.get("TEST_PING", "false").lower() == "true"

          REGISTER_URL = "https://panel.baohost.com/auth/register"

          if not WEBHOOK_URL:
              sys.exit("ERROR: DISCORD_WEBHOOK secret is empty!")

          if not ROLE_ID:
              sys.exit("ERROR: ROLE_ID is empty!")

          def send_discord(message):
              response = requests.post(
                  WEBHOOK_URL,
                  json={
                      "content": message,
                      "allowed_mentions": {
                          "parse": ["roles"]
                      }
                  },
                  timeout=20
              )
              response.raise_for_status()
              print("Discord notification sent successfully.")

          # Optional Discord test ping
          if TEST_PING:
              send_discord(
                  f"<@&{ROLE_ID}> 🛠️ *Test Ping Successful!* "
                  "BaoHost Signup Monitor is connected."
              )

          session = requests.Session(
              impersonate="chrome120"
          )

          session.headers.update({
              "Accept": "text/html,application/xhtml+xml,"
                        "application/xml;q=0.9,/;q=0.8",
              "Accept-Language": "en-US,en;q=0.9"
          })

          status = "UNKNOWN"
          reasons = []

          try:
              print("Checking BaoHost registration page...")

              response = session.get(
                  REGISTER_URL,
                  allow_redirects=True,
                  timeout=30
              )

              html = response.text.lower()
              final_url = str(response.url).lower()

              # Normalize HTML whitespace
              clean_html = re.sub(r"\s+", " ", html)

              print("HTTP Status:", response.status_code)
              print("Final URL:", final_url)

              # 1. Detect Cloudflare challenges
              challenge_markers = [
                  "cf-chl-",
                  "challenge-platform",
                  "just a moment",
                  "checking your browser",
                  "verify you are human",
                  "enable javascript and cookies"
              ]

              is_challenge = any(
                  marker in clean_html
                  for marker in challenge_markers
              )

              if response.status_code == 403 or is_challenge:
                  status = "UNKNOWN"
                  reasons.append(
                      "Cloudflare JavaScript challenge detected."
                  )

              # 2. Detect BaoHost's actual paused page
              elif response.status_code != 200:
                  status = "UNKNOWN"
                  reasons.append(
                      f"Website returned HTTP {response.status_code}."
                  )

              else:
                  paused_markers = [
                      "sign up paused",
                      "sign up is temporarily disabled",
                      "new registrations are currently paused",
                      "slots are full at the moment",
                      "some server systems are under maintenance",
                      "no eta for when sign up will reopen"
                  ]

                  is_paused = any(
                      marker in clean_html
                      for marker in paused_markers
                  )

                  if is_paused:
                      status = "CLOSED"
                      reasons.append(
                          "BaoHost SIGN UP PAUSED screen detected."
                      )

                  # 3. Detect an actual registration form
                  elif (
                      "/auth/register" in final_url
                      and "<form" in clean_html
                      and re.search(
                          r'type=["\']password["\']|'
                          r'name=["\']password["\']',
                          clean_html
                      )
                      and not is_challenge
                  ):
                      status = "OPEN"
                      reasons.append(
                          "Live registration form detected!"
                      )

                  else:
                      status = "UNKNOWN"
                      reasons.append(
                          "Registration form or paused status "
                          "could not be confirmed."
                      )

          except Exception as error:
              status = "UNKNOWN"
              reasons.append(
                  f"Website check failed: {str(error)[:150]}"
              )

          # 4. Report results
          summary = " | ".join(reasons)

          print("--------------------------------")
          print("BAOHOST STATUS:", status)
          print(summary)
          print("--------------------------------")

          if status == "OPEN":

              send_discord(
                  f"<@&{ROLE_ID}> 🟢 *BAOHOST SIGN-UPS ARE OPEN!*\n\n"
                  f"Registration page: {REGISTER_URL}\n"
                  f"Details: {summary}\n\n"
                  "🚀 *Register now before slots fill up!*"
              )

          elif status == "CLOSED":

              print("🔴 Sign-ups are still paused.")
              print("No Discord alert sent.")

          else:

              print("🟡 Status unknown.")
              print("No false OPEN alert sent.")
