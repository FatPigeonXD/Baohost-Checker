name: Check BaoHost Signups

on:
  workflow_dispatch:
    inputs:
      send_test_ping:
        description: 'Send a test ping to Discord right now?'
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: pip install curl_cffi

      - name: Check Registration Status
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: "1560630961199124560" # <-- Replace with your Discord Role ID
          TEST_PING: ${{ inputs.send_test_ping }}
        run: |
          import os
          import sys
          import json
          from curl_cffi import requests

          webhook_url = os.environ.get("WEBHOOK_URL", "").strip()
          role_id = os.environ.get("ROLE_ID", "").strip()
          test_ping = os.environ.get("TEST_PING", "false").lower() == "true"

          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK secret is empty!")
              sys.exit(1)

          def send_discord_message(text):
              payload = {
                  "content": text,
                  "allowed_mentions": {"parse": ["roles"]}
              }
              requests.post(webhook_url, json=payload, timeout=15)

          if test_ping:
              send_discord_message(f"<@&{role_id}> 🛠️ **Test Role Ping Successful!** Monitor is connected.")

          # Check the Help Center Article
          try:
              resp = requests.get("https://help.baohost.com/articles/registration-for-new-users", impersonate="chrome120", timeout=20)
              help_html = resp.text.lower()

              if resp.status_code != 200:
                  print(f"Help article returned HTTP {resp.status_code}")
                  sys.exit(0)

              # If the article no longer says registrations are closed:
              if "new registrations are currently closed" not in help_html and "closed" not in help_html:
                  send_discord_message(f"<@&{role_id}> 🟢 **BaoHost Sign-Ups appear to be OPEN!**\nRegister now: https://panel.baohost.com/auth/register")
                  print("SUCCESS: OPEN alert sent!")
              else:
                  send_discord_message(f"🔴 **BaoHost Check:** Sign-ups are still closed. *(Help article confirmed closed)*")
                  print("SUCCESS: Closed status sent.")
          except Exception as e:
              print("Error checking Help Center:", e)
