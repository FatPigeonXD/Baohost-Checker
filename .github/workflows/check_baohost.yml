name: Check BaoHost Signups

on:
  workflow_dispatch:
    inputs:
      send_test_ping:
        description: 'Send a test ping to Discord right now?'
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: pip install curl_cffi

      - name: Monitor Panel Status
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: "112233445566778899" # <-- Replace with your Discord Role ID
          TEST_PING: ${{ inputs.send_test_ping }}
        run: |
          import os
          import sys
          import json
          from curl_cffi import requests

          webhook_url = os.environ.get("WEBHOOK_URL", "").strip()
          role_id = os.environ.get("ROLE_ID", "").strip()
          test_ping = os.environ.get("TEST_PING", "false").lower() == "true"

          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK secret is empty!")
              sys.exit(1)

          def send_discord_message(text):
              payload = {
                  "content": text,
                  "allowed_mentions": {"parse": ["roles"]}
              }
              requests.post(webhook_url, json=payload, timeout=15)

          if test_ping:
              send_discord_message(f"<@&{role_id}> 🛠️ **Test Role Ping Successful!** Monitor is connected.")

          # Use Chrome TLS fingerprinting
          session = requests.Session(impersonate="chrome120")
          
          target_url = "https://panel.baohost.com/auth/register"
          is_open = False
          status_detail = ""

          try:
              # We check how the server responds to a standard browser-like request
              resp = session.get(target_url, allow_redirects=True, timeout=20)
              final_url = str(resp.url).lower()
              status_code = resp.status_code
              body_snippet = resp.text[:300].lower()

              status_detail = f"Code: {status_code}, URL: {final_url}"

              # Criteria for an unannounced silent opening:
              # 1. It stops throwing strict blocking codes and gives a clean 200 OK
              # 2. It doesn't instantly bounce you back out to a strict login/closed handler
              if status_code == 200:
                  if "auth/login" not in final_url and "closed" not in body_snippet:
                      is_open = True
                      status_detail = "Panel returned clean 200 OK without login redirect!"
                  else:
                      status_detail = "Panel active layout but still routing to login/closed."
              elif status_code == 403:
                  status_detail = "Cloudflare JS Challenge active (Standard Closed State)"
              else:
                  status_detail = f"Unexpected status: {status_code}"

          except Exception as e:
              status_detail = f"Connection error: {str(e)[:30]}"

          if is_open:
              send_discord_message(f"<@&{role_id}> 🟢 **BaoHost Sign-Ups MIGHT BE OPEN (Silent Shift Detected)!**\nStatus: {status_detail}\nCheck now: https://panel.baohost.com/auth/register")
              print("SUCCESS: Potential open alert sent!")
          else:
              send_discord_message(f"🔴 **BaoHost Check:** Closed. *({status_detail})*")
              print("SUCCESS: Checked, currently closed.", status_detail)
