name: Check BaoHost Signups

on:
  workflow_dispatch:
    inputs:
      send_test_ping:
        description: "Send a Discord test ping?"
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Test Discord BEFORE installing anything
      - name: Test Discord Webhook
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: "1560630961199124560"
          TEST_PING: ${{ inputs.send_test_ping }}
        run: |
          set -e

          if [ -z "$WEBHOOK_URL" ]; then
            echo "ERROR: DISCORD_WEBHOOK secret is missing!"
            exit 1
          fi

          if [ "$TEST_PING" = "true" ]; then
            CONTENT="<@&${ROLE_ID}> 🛠️ BaoHost Discord webhook test successful!"
          else
            CONTENT="🟡 BaoHost monitor started. Checking registration status..."
          fi

          HTTP_CODE=$(curl -sS \
            -o discord_response.txt \
            -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$(python -c 'import json,os; print(json.dumps({"content":os.environ["CONTENT"],"allowed_mentions":{"parse":["roles"]}}))' CONTENT="$CONTENT")" \
            "$WEBHOOK_URL")

          echo "Discord HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "Discord webhook failed."
            cat discord_response.txt
            exit 1
          fi

          echo "SUCCESS: Discord accepted the message."

      # STEP 2: Install browser
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      # STEP 3: Check BaoHost
      - name: Check Registration
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: "1560630961199124560"
        run: |
          python - <<'PY'
          import os
          import re
          import requests
          from playwright.sync_api import sync_playwright

          WEBHOOK = os.environ["WEBHOOK_URL"]
          ROLE_ID = os.environ["ROLE_ID"]
          URL = "https://panel.baohost.com/auth/register"

          def send_discord(message):
              r = requests.post(
                  WEBHOOK,
                  json={
                      "content": message,
                      "allowed_mentions": {"parse": ["roles"]}
                  },
                  timeout=20
              )
              print("Discord response:", r.status_code)
              r.raise_for_status()

          status = "UNKNOWN"
          reason = "Registration could not be verified."

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()

                  response = page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.wait_for_timeout(5000)

                  code = response.status if response else 0
                  text = re.sub(
                      r"\s+", " ",
                      page.locator("body").inner_text().lower()
                  )

                  print("HTTP:", code)
                  print("URL:", page.url)
                  print("Page:", text[:1000])

                  challenge_words = [
                      "just a moment",
                      "verify you are human",
                      "checking your browser",
                      "challenge-platform",
                      "cf-chl-"
                  ]

                  paused_words = [
                      "sign up paused",
                      "sign up is temporarily disabled",
                      "new registrations are currently paused",
                      "slots are full at the moment",
                      "some server systems are under maintenance",
                      "no eta for when sign up will reopen"
                  ]

                  if code == 403 or any(x in text for x in challenge_words):
                      status = "UNKNOWN"
                      reason = "Cloudflare challenge detected."

                  elif code != 200:
                      reason = f"BaoHost HTTP {code}"

                  elif any(x in text for x in paused_words):
                      status = "CLOSED"
                      reason = "BaoHost SIGN UP PAUSED page detected."

                  elif (
                      "/auth/register" in page.url.lower()
                      and page.locator("form:visible").count() > 0
                      and page.locator('input[type="password"]:visible').count() > 0
                  ):
                      status = "OPEN"
                      reason = "Registration form detected."

                  else:
                      reason = "No confirmed registration form or paused message."

                  if status == "UNKNOWN":
                      page.screenshot(
                          path="baohost-debug.png",
                          full_page=True
                      )

                  browser.close()

          except Exception as e:
              status = "UNKNOWN"
              reason = f"Browser error: {str(e)[:250]}"
              print(reason)

          print("FINAL STATUS:", status)
          print("REASON:", reason)

          if status == "OPEN":
              message = (
                  f"<@&{ROLE_ID}> 🟢 *BAOHOST SIGN-UPS ARE OPEN!*\n"
                  f"{URL}\n{reason}"
              )
          elif status == "CLOSED":
              message = (
                  "🔴 *BAOHOST SIGN-UPS ARE CLOSED*\n"
                  + reason
              )
          else:
              message = (
                  "🟡 *BAOHOST STATUS: UNKNOWN*\n"
                  + reason
              )

          send_discord(message)
          print("Finished successfully.")
          PY

      # STEP 4: Preserve diagnostic screenshot
      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baohost-debug
          path: baohost-debug.png
          if-no-files-found: ignore
